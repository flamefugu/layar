<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penerjemah Layar Game</title>
<style>
:root{--bg:#14161b;--card:#1f232b;--tx:#eef1f6;--mut:#9aa4b5;--ac:#6ea8ff;--line:#2e3440}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:1000px;margin-inline:auto}
h1{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.inline{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--tx)}
select,input[type=number]{background:#12151a;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
button{background:var(--ac);color:#0b1020;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:#2a303b;color:var(--tx)}
#stage{position:relative;line-height:0;background:#000;border-radius:8px;overflow:hidden;cursor:crosshair;touch-action:none;display:none}
#stage video{width:100%;height:auto;display:block}
#selbox{position:absolute;border:2px dashed #ffd24a;background:rgba(255,210,74,.12);display:none;pointer-events:none}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
#status{font-size:12px;color:var(--mut)}
#out{background:#0d0f13;border-radius:10px;padding:12px;min-height:90px}
#trans{font-size:var(--fs,26px);line-height:1.35;font-weight:600;word-break:break-word}
#orig{font-size:12px;color:var(--mut);margin-top:8px;word-break:break-word}
#hist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--mut);max-height:180px;overflow:auto}
#hist div{padding:3px 0;border-bottom:1px dashed #262b33}
canvas{display:none}
</style>
</head>
<body>
<h1>🎮 Penerjemah Layar Game</h1>

<div class="card">
  <div class="row">
    <button id="btnStart">Pilih layar / jendela game</button>
    <button id="btnPause" class="sec" disabled>Jeda</button>
    <button id="btnFloat" class="sec">Mode subtitle (melayang)</button>
    <span id="status">Belum mulai.</span>
  </div>
  <div class="row" style="margin-top:10px">
    <label>Bahasa di game
      <select id="srcLang">
        <option value="eng|en">Inggris</option>
        <option value="jpn|ja">Jepang</option>
        <option value="kor|ko">Korea</option>
        <option value="chi_sim|zh-CN">Mandarin (sederhana)</option>
        <option value="chi_tra|zh-TW">Mandarin (tradisional)</option>
        <option value="rus|ru">Rusia</option>
        <option value="fra|fr">Prancis</option>
        <option value="deu|de">Jerman</option>
        <option value="spa|es">Spanyol</option>
      </select>
    </label>
    <label>Terjemahkan ke
      <select id="tgtLang">
        <option value="id">Indonesia</option>
        <option value="en">Inggris</option>
      </select>
    </label>
    <label>Cek tiap (detik)
      <input type="number" id="interval" min="0.5" max="10" step="0.5" value="1.5" style="width:80px">
    </label>
    <label>Perbesar gambar
      <select id="scale"><option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option></select>
    </label>
    <label>Subtitle hilang setelah (detik, 0 = tetap)
      <input type="number" id="hideSec" min="0" max="60" value="6" style="width:80px">
    </label>
    <label>Ukuran teks hasil
      <input type="number" id="fs" min="12" max="80" value="26" style="width:80px">
    </label>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="inline"><input type="checkbox" id="invert"> Teks terang di latar gelap (balik warna)</label>
    <label class="inline"><input type="checkbox" id="showOrig" checked> Tampilkan teks asli</label>
  </div>
</div>

<div class="card">
  <div id="stage"><video id="video" autoplay muted playsinline></video><div id="selbox"></div></div>
  <div class="hint" id="stageHint">Setelah layar dipilih, seret mouse di atas preview untuk menandai area teks (misalnya kotak dialog). Klik sekali di preview untuk menghapus area. Area kecil = lebih cepat dan lebih akurat.</div>
</div>

<div class="card" id="outWrap">
  <div id="out">
    <div id="trans">Hasil terjemahan muncul di sini.</div>
    <div id="orig"></div>
    <div id="hist"></div>
  </div>
</div>

<canvas id="cv"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), stage = $('stage'), selbox = $('selbox'), cv = $('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const statusEl = $('status');

  let stream = null, worker = null, workerLang = null;
  let running = false, paused = false, timer = null, busy = false;
  let sel = null; // pecahan 0..1 dari video: {x,y,w,h}
  let lastText = '', pipSub = null, subT = null;
  const cache = new Map();
  const hist = [];

  // ---------- pengaturan tersimpan ----------
  const KEYS = ['srcLang', 'tgtLang', 'interval', 'scale', 'fs', 'hideSec'];
  try {
    const s = JSON.parse(localStorage.getItem('tl-set') || '{}');
    KEYS.forEach(k => { if (s[k] != null) $(k).value = s[k]; });
    if (s.invert != null) $('invert').checked = s.invert;
    if (s.showOrig != null) $('showOrig').checked = s.showOrig;
  } catch (e) {}
  function save() {
    try {
      const s = {};
      KEYS.forEach(k => s[k] = $(k).value);
      s.invert = $('invert').checked; s.showOrig = $('showOrig').checked;
      localStorage.setItem('tl-set', JSON.stringify(s));
    } catch (e) {}
  }
  function applyFs() { document.documentElement.style.setProperty('--fs', ($('fs').value || 26) + 'px'); }
  function applyOrig() { $('orig').style.display = $('showOrig').checked ? '' : 'none'; }
  document.querySelectorAll('select,input').forEach(el => el.addEventListener('change', () => { save(); applyFs(); applyOrig(); if (el.id === 'srcLang') lastText = ''; }));
  $('fs').addEventListener('input', () => { applyFs(); save(); });
  applyFs(); applyOrig();

  const setStatus = t => statusEl.textContent = t;

  // ---------- tangkap layar ----------
  $('btnStart').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 10 }, audio: false });
    } catch (e) { setStatus('Dibatalkan / ditolak: ' + e.message); return; }
    video.srcObject = stream;
    stage.style.display = 'block';
    stream.getVideoTracks()[0].onended = stopAll;
    running = true; paused = false;
    $('btnPause').disabled = false; $('btnPause').textContent = 'Jeda';
    setStatus('Menyiapkan OCR…');
    clearTimeout(timer); tick();
  };
  function stopAll() {
    running = false; clearTimeout(timer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; stage.style.display = 'none';
    $('btnPause').disabled = true; setStatus('Berhenti. Klik tombol pertama untuk mulai lagi.');
  }
  $('btnPause').onclick = () => {
    paused = !paused;
    $('btnPause').textContent = paused ? 'Lanjut' : 'Jeda';
    setStatus(paused ? 'Dijeda.' : 'Berjalan…');
  };

  // ---------- pilih area ----------
  let drag = null;
  function drawSel() {
    if (!sel) { selbox.style.display = 'none'; return; }
    Object.assign(selbox.style, { display: 'block', left: sel.x * 100 + '%', top: sel.y * 100 + '%', width: sel.w * 100 + '%', height: sel.h * 100 + '%' });
  }
  const pos = e => { const r = stage.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };
  stage.addEventListener('pointerdown', e => { drag = pos(e); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = pos(e);
    sel = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) };
    drawSel();
  });
  stage.addEventListener('pointerup', () => {
    drag = null;
    if (sel && (sel.w < 0.02 || sel.h < 0.02)) sel = null;
    drawSel(); lastText = '';
  });

  // ---------- OCR ----------
  async function ensureWorker() {
    const lang = $('srcLang').value.split('|')[0];
    if (worker && workerLang === lang) return;
    if (worker) { await worker.terminate(); worker = null; }
    setStatus('Mengunduh data bahasa OCR (sekali saja, lalu di-cache)…');
    worker = await Tesseract.createWorker(lang);
    workerLang = lang;
    setStatus('Berjalan…');
  }

  function capture() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return false;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (sel) { sx = sel.x * vw; sy = sel.y * vh; sw = sel.w * vw; sh = sel.h * vh; }
    let sc = Number($('scale').value) || 2;
    while (sw * sc > 3000 && sc > 1) sc--;
    cv.width = Math.max(1, Math.round(sw * sc));
    cv.height = Math.max(1, Math.round(sh * sc));
    ctx.filter = 'grayscale(1) contrast(1.4)';
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    ctx.filter = 'none';
    if ($('invert').checked) {
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.globalCompositeOperation = 'source-over';
    }
    return true;
  }

  function clean(t, src) {
    t = t.replace(/\s*\n\s*/g, ' ').replace(/[|_~`^]{2,}/g, ' ').replace(/\s{2,}/g, ' ').trim();
    if (/^(jpn|chi_sim|chi_tra|kor)$/.test(src)) t = t.replace(/\s+/g, '');
    return t;
  }

  function sim(a, b) { // kemiripan bigram (Dice)
    if (!a || !b) return 0;
    if (a === b) return 1;
    const bg = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const k = s.substr(i, 2); m.set(k, (m.get(k) || 0) + 1); } return m; };
    const A = bg(a), B = bg(b); let inter = 0, ta = 0, tb = 0;
    A.forEach(v => ta += v); B.forEach(v => tb += v);
    A.forEach((v, k) => { if (B.has(k)) inter += Math.min(v, B.get(k)); });
    return ta + tb ? 2 * inter / (ta + tb) : 0;
  }

  // ---------- terjemahan ----------
  async function translate(text, sl, tl) {
    const key = sl + tl + text;
    if (cache.has(key)) return cache.get(key);
    let res = null;
    try {
      const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text));
      const j = await r.json();
      res = j[0].map(x => x[0]).join('');
    } catch (e) {
      try {
        const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 450)) + '&langpair=' + sl + '|' + tl);
        const j = await r.json();
        res = j.responseData.translatedText;
      } catch (e2) { throw new Error('Terjemahan gagal (cek koneksi internet)'); }
    }
    cache.set(key, res);
    return res;
  }

  function renderHist() {
    $('hist').innerHTML = '';
    hist.slice().reverse().forEach(h => {
      const d = document.createElement('div'); d.textContent = h; $('hist').appendChild(d);
    });
  }

  // ---------- loop utama ----------
  async function tick() {
    if (!running) return;
    if (!paused && !busy) {
      busy = true;
      try {
        await ensureWorker();
        if (capture()) {
          const [ocrLang, sl] = $('srcLang').value.split('|');
          const { data } = await worker.recognize(cv);
          const text = clean(data.text || '', ocrLang);
          if (text.length >= 3 && data.confidence >= 35 && sim(text, lastText) < 0.85) {
            lastText = text;
            $('orig').textContent = text;
            setStatus('Menerjemahkan…');
            const tr = await translate(text, sl, $('tgtLang').value);
            $('trans').textContent = tr;
            hist.push(tr); if (hist.length > 8) hist.shift();
            renderHist();
            if (pipSub) {
              pipSub.style.fontSize = ($('fs').value || 26) + 'px';
              pipSub.textContent = tr;
              clearTimeout(subT);
              const hs = Number($('hideSec').value) || 0;
              if (hs > 0) subT = setTimeout(() => { if (pipSub) pipSub.textContent = ''; lastText = ''; }, hs * 1000);
            }
            setStatus('Berjalan…');
          }
        }
      } catch (e) { setStatus('Error: ' + e.message); }
      busy = false;
    }
    timer = setTimeout(tick, Math.max(500, (Number($('interval').value) || 1.5) * 1000));
  }

  // ---------- mode melayang (selalu di atas) ----------
  $('btnFloat').onclick = async () => {
    if (!('documentPictureInPicture' in window)) {
      alert('Browser ini belum mendukung mode melayang. Pakai Chrome versi terbaru di PC, atau taruh halaman ini di jendela/monitor kedua.');
      return;
    }
    try {
      const pw = await documentPictureInPicture.requestWindow({ width: 900, height: 110 });
      const st = pw.document.createElement('style');
      st.textContent = 'html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,"Segoe UI",sans-serif}' +
        '#sub{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 14px;font-weight:600;line-height:1.3;word-break:break-word;text-shadow:0 0 4px #000}' +
        '#pz{position:fixed;top:2px;right:4px;background:none;border:0;color:#666;font-size:12px;cursor:pointer}';
      pw.document.head.appendChild(st);
      const sub = pw.document.createElement('div');
      sub.id = 'sub'; sub.style.fontSize = ($('fs').value || 26) + 'px';
      const pz = pw.document.createElement('button');
      pz.id = 'pz'; pz.textContent = '⏸';
      pz.onclick = () => $('btnPause').click();
      pw.document.body.append(sub, pz);
      pipSub = sub;
      pw.addEventListener('pagehide', () => { pipSub = null; });
    } catch (e) { alert('Gagal membuka mode melayang: ' + e.message); }
  };

  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    setStatus('Browser ini tidak mendukung tangkap layar. Pakai Chrome di PC/laptop.');
    $('btnStart').disabled = true;
  }
})();
</script>
</body>
</html>
